 const b=w.querySelector('button');let used=false;const go=()=>{if(used)return;used=true;OVKEY=null;cb()};b.onclick=go;setTimeout(()=>{try{b.focus({preventScroll:true})}catch(e){}},50);w.scrollIntoView({block:'nearest',behavior:'smooth'});

function quiz(id,mode,cb){G.mode='dialog';openOv(`<div class="panel"><div class="qhost"></div></div>`);const host=ov.querySelector('.qhost');const q=buildQ(id,true);
 if(mode==='pre')q.label='🤔 PRE-TEST — make your best guess (no penalty!)';else q.label='✅ QUICK CHECK — '+q.label.replace(/^\S+\s/,'');
 renderQ(q,host,(ok)=>{SND.play(ok?'correct':'wrong');let extra='';if(mode==='check'){grade(id,ok);if(ok){gainXP(5,true);extra='<div>+5 XP</div>'}else extra='<div>No worries—this one will come back soon so you can try again.</div>'}else extra=ok?'<div>Great guess! Now let\'s lock it in.</div>':'<div>That\'s okay—guessing first helps your brain grab the real answer. Listen closely!</div>';feedback(host,ok,q,extra,cb)})}
function runLesson(key,speaker,done){const steps=LESSONS[key];let i=0;const next=()=>{if(i>=steps.length){done&&done();return}const st=steps[i++];
  if(st[0]==='say')say(speaker,st[1],next);else if(st[0]==='teach')say(speaker,st[2],()=>{unlock('t:'+st[1]);termCard(st[1],next)});else if(st[0]==='pre')quiz(st[1],'pre',next);else if(st[0]==='check'){if(st[1].startsWith('c_'))unlock(st[1]);quiz(st[1],'check',next)}};next()}

function bgTree(g,x,y,s,col,kind){g.save();g.translate(x,y);g.scale(s,s);if(kind==='pine'){rr(g,-2,-6,4,7,1);fs(g,'#6b4220',1.5);poly(g,[[0,-34],[8,-20],[5,-20],[11,-8],[-11,-8],[-5,-20],[-8,-20]],col,2)}
 else if(kind==='cypress'){rr(g,-1.5,-5,3,6,1);fs(g,'#6b4220',1.2);g.beginPath();g.moveTo(0,-36);g.quadraticCurveTo(7,-20,5,-5);g.lineTo(-5,-5);g.quadraticCurveTo(-7,-20,0,-36);g.closePath();fs(g,col,2)}
 else if(kind==='dead'){g.strokeStyle=INK;g.lineWidth=4;g.beginPath();g.moveTo(0,0);g.lineTo(0,-20);g.moveTo(0,-11);g.lineTo(-8,-19);g.moveTo(0,-15);g.lineTo(8,-24);g.moveTo(0,-20);g.lineTo(-2,-28);g.stroke();g.strokeStyle='#5b4636';g.lineWidth=2;g.stroke()}
 else{rr(g,-2,-9,4,10,1);fs(g,'#7a4a24',1.5);g.fillStyle=INK;[[-5,-14,6],[5,-14,6],[0,-20,7]].forEach(([a,b,r])=>{ell(g,a,b,r+2,r+2);g.fill()});g.fillStyle=col;[[-5,-14,6],[5,-14,6],[0,-20,7]].forEach(([a,b,r])=>{ell(g,a,b,r,r);g.fill()});g.fillStyle=shade(col,30);ell(g,-3,-23,2.5,1.6);g.fill()}g.restore()}

 g.fillStyle='rgba(20,20,40,.25)';ell(g,cx+6*k,cy+ry*0.75,rx*1.02,ry*0.9);g.fill();

 // players

  const lbl=p.me?'YOU':p.name;c.font='bold 10px Fredoka, sans-serif';const tw=c.measureText(lbl).width+10;rr(c,p.x-tw/2,p.y-66,tw,13,5);c.fillStyle=p.me?'#ffd23f':done?'#c9c9d4':'#fff4d6';c.fill();c.strokeStyle=INK;c.lineWidth=1.4;c.stroke();c.fillStyle=INK;c.textAlign='center';c.textBaseline='middle';c.fillText(lbl,p.x,p.y-59.5);
  if(done){c.font='12px sans-serif';c.fillText('✓',p.x+tw/2+6,p.y-60)}if(p.busy){c.font='14px sans-serif';c.fillText('⚔️',p.x,p.y-76)}});
 // effects
 for(let i=RM.fx.length-1;i>=0;i--){const f=RM.fx[i];f.t+=1/60;if(f.t>1){RM.fx.splice(i,1);continue}const a=1-f.t;c.save();c.globalAlpha=a;if(f.small){c.font='bold 13px Fredoka, sans-serif';c.textAlign='center';c.lineWidth=3;c.strokeStyle=INK;c.strokeText(f.txt,f.x,f.y-f.t*20);c.fillStyle='#ffd23f';c.fillText(f.txt,f.x,f.y-f.t*20)}else{star(c,f.x,f.y,16+f.t*6,8,10,f.t*3);c.fillStyle='#ffd23f';c.fill();c.strokeStyle=INK;c.lineWidth=2;c.stroke();c.font='11px "Luckiest Guy", Impact';c.fillStyle='#e4572e';c.textAlign='center';c.textBaseline='middle';c.fillText(f.txt,f.x,f.y+1)}c.restore()}
 // timer
 const tm=ov.querySelector('.rtimer');if(tm){const m=Math.floor(RM.left/60),s2=RM.left%60;tm.textContent=`⏱ ${m}:${String(s2).padStart(2,'0')}`;tm.classList.toggle('hurry',RM.left<=15)}
 const unf=RM.players.filter(p=>!p.me&&!RM.fought.has(p.id)).length;if(!RM.duel&&!(RM.mode==='live'&&RM.role==='host')&&unf===0&&RM.players.length>1){c.setTransform(dpr,0,0,dpr,0,0);c.font='bold 15px Fredoka, sans-serif';c.textAlign='center';const msg='You\'ve battled everyone! Grab golden books 📕 until time runs out.';const tw=c.measureText(msg).width+20;rr(c,W/2-tw/2,H-40,tw,28,10);fs(c,'#fff4d6',2.5);c.fillStyle=INK;c.fillText(msg,W/2,H-25)}}
function rmBoard(){if(!RM||!ov.querySelector('.rwrap'))return;const ps=RM.players.slice();const sorted=ps.sort((a,b)=>b.score-a.score);const sc=ov.querySelector('.rscore');if(sc)sc.textContent=`${RM.score} pts`;const rk=ov.querySelector('.rrank');if(rk){const i=sorted.findIndex(p=>p.me);rk.textContent=i>=0?` · #${i+1} of ${sorted.length}`:''}

/* ---- duels ---- */
function rmDuel(p){const me=RM.me;RM.fought.add(p.id);p.busy=true;me.busy=true;me.moving=false;SND.play('zip');const ids=ALL_IDS();let id;
 if(RM.mode==='live'){const pair=[RM.peer||'me',p.id].sort().join('|');let h=0;for(const ch of pair+RM.round)h=(h*31+ch.charCodeAt(0))>>>0;id=ids[h%ids.length]}else{for(let k=0;k<20;k++){id=pick(ids);if(!RM.recent.includes(id))break}RM.recent.push(id);if(RM.recent.length>10)RM.recent.shift()}
 const q=buildQ(id,true,false);RM.duel={p,q,t0:performance.now(),answered:false};const box=ov.querySelector('.rduel');box.className='rduel show';
 box.innerHTML=`<div class="panel duelp"><div class="dhead"><canvas class="dl" width="96" height="112"></canvas><div class="tf vs">VS!</div><canvas class="dr" width="96" height="112"></canvas></div><div class="tf" style="text-align:center;font-size:20px">DUEL: You vs ${esc(p.name)}!</div>
  <div class="qlabel">${q.label}</div><div class="qprompt">${esc(q.prompt)}</div><div class="ropts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${i+1}</b>${esc(o)}</button>`).join('')}</div><div class="rfb"></div></div>`;
 rmSprite(box.querySelector('.dl'),me.look);rmSprite(box.querySelector('.dr'),p.look);
 const go=(btn)=>{if(RM.duel.answered)return;RM.duel.answered=true;const ok=q.options[+btn.dataset.i]===q.answer;const ms=performance.now()-RM.duel.t0;box.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(q.options[+b.dataset.i]===q.answer)b.classList.add('right')});if(!ok)btn.classList.add('wrongc');if(S&&!RM.tempS)grade(q.id,ok);
  if(RM.mode==='bots')rmResolve(ok?'win':'lose',ms<4000);else{RM.duels.push({w:p.id,ok:ok?1:0,ms:Math.round(ms)});if(RM.duels.length>12)RM.duels.shift();rmPush();box.querySelector('.rfb').innerHTML='<div class="fb">Waiting for '+esc(p.name)+'…</div>';RM.duel.waitStart=performance.now();RM.duel.mine={ok,ms}}};
 box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>go(b));OVKEY=e=>{const n=parseInt(e.key);if(n>=1&&n<=q.options.length){const b=box.querySelector(`.opt[data-i="${n-1}"]`);if(b&&!b.disabled)go(b)}}}
function rmResolve(res,fast){const d=RM.duel;if(!d||d.done)return;d.done=true;const p=d.p;const box=ov.querySelector('.rduel');const fb=box.querySelector('.rfb');
 if(res==='win'){const pts=10+(fast?2:0);RM.score+=pts;RM.me.score=RM.score;if(RM.mode==='bots')p.score=Math.max(0,p.score-5);SND.play('correct');setTimeout(()=>SND.play('slap'),60);rmPanel(p,'enemy');fb.innerHTML=`<div class="fb ok"><b class="tf">SLAP!</b> You win! +${pts}${RM.mode==='bots'?` · ${esc(p.name)} −5`:''}</div>`;RM.fx.push({x:p.x,y:p.y-40,t:0,txt:'SLAP!'})}
 else if(res==='lose'){RM.score=Math.max(0,RM.score-5);RM.me.score=RM.score;if(RM.mode==='bots')p.score+=10;SND.play('wrong');setTimeout(()=>SND.play('slap'),60);rmPanel(p,'player');fb.innerHTML=`<div class="fb no"><b class="tf">SMACKED!</b> ${esc(p.name)} wins · you −5 · Answer: <b>${esc(d.q.answer)}</b></div>`;RM.fx.push({x:RM.me.x,y:RM.me.y-40,t:0,txt:'SMACK!'})}
 else{SND.play('wrong');fb.innerHTML=`<div class="fb no"><b class="tf">Double dizzy!</b> Nobody wins. Answer: <b>${esc(d.q.answer)}</b></div>`}
 rmPush();rmBoard();setTimeout(()=>{if(!RM)return;box.className='rduel';box.innerHTML='';p.busy=false;RM.me.busy=false;RM.duel=null;RM.inv=1.5;OVKEY=null;const dx=RM.me.x-p.x,dy=RM.me.y-p.y,dd=Math.hypot(dx,dy)||1;for(let k=0;k<12;k++){const nx=RM.me.x+dx/dd*4,ny=RM.me.y+dy/dd*4;if(libWalk(nx,ny)){RM.me.x=nx;RM.me.y=ny}}},2100)}
function rmPanel(other,who){who=who||'player';const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none';document.body.appendChild(cv);const c=cv.getContext('2d');const t0=performance.now()/1000;

 const f=()=>{const now=performance.now()/1000,p=(now-t0)/0.95;if(p>1){cv.remove();return}const dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);const He=Math.min(H,W*0.42);c.fillStyle=`rgba(29,26,43,${0.5*Math.min(1,(1-p)*6)})`;c.fillRect(0,0,W,H);c.translate(0,(H-He)/2);const k=Math.min(W/360,He/230);slapPanel(c,W,He,k,now,cfg,who,p);requestAnimationFrame(f)};f()}
/* ---- live room plumbing (presence only: works for every admitted viewer) ---- */
function rmPush(){if(RM&&RM.mode==='live'&&ROOM)ROOM.presence({score:RM.score,duels:RM.duels.slice(-12)}).catch(()=>{})}
function rmPeers(){if(!RM||RM.mode!=='live'||!ROOM)return;const all=ROOM.peers();const meP=all.find(p=>p.sameTab);if(meP)RM.peer=meP.peer;const ps=all.filter(p=>p.presence&&p.presence.rc===RM.code);
 const hosts=ps.filter(p=>p.presence.host).sort((a,b)=>(a.presence.hostSince||0)-(b.presence.hostSince||0));RM.hostP=hosts[0]||null;
 const old=new Map(RM.players.map(p=>[p.id,p]));const list=RM.role==='host'?[]:[RM.me];
 ps.forEach(p=>{if(p.sameTab||p.presence.role!=='player')return;const pr=p.presence;let o=old.get(p.peer);if(!o){o={id:p.peer,x:+pr.x||100,y:+pr.y||100,t:0}}o.name=String(pr.name||'Player').slice(0,16);o.look=(+pr.look||0)%4;o.score=Math.max(0,+pr.score||0);o.tx=+pr.x||o.x;o.ty=+pr.y||o.y;o.dir=['up','down','left','right'].includes(pr.d)?pr.d:'down';o.moving=!!pr.mv;o.duels=Array.isArray(pr.duels)?pr.duels:[];list.push(o)});
 RM.players=list;RM.me.score=RM.score;
 const hs=RM.hostP?RM.hostP.presence:null;const state=RM.role==='host'?RM.hstate||'lobby':(hs?hs.state:'lobby');if(RM.role!=='host'&&hs)RM.left=+hs.left||0;
 if(state==='live'&&RM.phase!=='live'){RM.phase='live';RM.score=0;RM.duels=[];RM.fought=new Set();RM.round=(+(hs&&hs.round)||RM.round);rmPush();SND.setTrack('battle');rmArenaUI()}
 else if(state==='over'&&RM.phase==='live'){RM.phase='over';rmPodium()}else if(state==='lobby'&&RM.phase!=='lobby'){RM.phase='lobby';rmLobbyUI()}
 if(RM.phase==='lobby')rmLobbyRoster();
 // peers who have duelled me (they hit me first): start the duel on my side too

 rmCheckDuel()}
function rmCheckDuel(){const d=RM&&RM.duel;if(!d||!d.mine||d.done)return;const p=RM.players.find(x=>x.id===d.p.id)||d.p;const theirs=(p.duels||[]).find(x=>x&&x.w===RM.peer);const waited=performance.now()-(d.waitStart||performance.now());
 if(!theirs&&waited<15000)return;const mo=d.mine.ok,to=theirs?!!theirs.ok:false,mm=d.mine.ms,tm=theirs?+theirs.ms||99999:99999;
 let res;if(mo&&!to)res='win';else if(!mo&&to)res='lose';else if(mo&&to)res=mm<=tm?'win':'lose';else res='tie';rmResolve(res,mm<4000)}
let rmLastPos=0;function rmLiveTick(dt){const now=performance.now();if(RM.role!=='host'&&now-rmLastPos>90){rmLastPos=now;ROOM.presence({x:Math.round(RM.me.x),y:Math.round(RM.me.y),d:RM.me.dir,mv:RM.me.moving?1:0}).catch(()=>{})}

function rmTickLive(){if(!RM)return;if(RM.role==='host'&&RM.hstate==='live'){RM.left=Math.max(0,RM.left-1);ROOM.presence({left:RM.left}).catch(()=>{});if(RM.left<=0){RM.hstate='over';ROOM.presence({state:'over'}).catch(()=>{});RM.phase='over';rmPodium();return}}}

function rmPodium(){if(!RM)return;const box=ov.querySelector('.rduel');if(box){box.className='rduel';box.innerHTML=''}RM.duel=null;$('#touch').style.display='none';SND.setTrack('hub');SND.play('win');setTimeout(()=>SND.play('levelup'),900);
 const players=RM.players.slice();const me=players.find(p=>p.me);if(me)me.score=RM.score;const sorted=players.sort((a,b)=>b.score-a.score);const top=[sorted[1],sorted[0],sorted[2]];
 rmShell(`<div class="rtop"><div class="tf rtitle">Royal Rumble — Results!</div><button class="btn small rleave">✖ Leave</button></div><div class="rmain col"><div class="podium">${top.map((p,i)=>p?`<div class="pcol p${[2,1,3][i]}"><canvas width="120" height="140"></canvas><div class="pname">${esc(p.name)}${p.me?' (you)':''}</div><div class="pblock tf"><span>${['🥈','🥇','🥉'][i]}</span>${[2,1,3][i]}<small>${p.score} pts</small></div></div>`:'<div class="pcol"></div>').join('')}</div>
  <div class="rboard">${sorted.map((p,i)=>`<div class="rrow ${p.me?'mine':''}"><span class="rpos">#${i+1}</span><span class="rpn">${esc(p.name)}${p.me?' (you)':''}</span><span class="rpp">${p.score}</span></div>`).join('')}</div>
  <div class="row2">${RM.mode==='bots'?'<button class="btn red again">🔁 Rematch</button>':RM.role==='host'?'<button class="btn red hagain">🔁 New round</button>':'<span style="color:#fff;font-weight:700">Waiting for the host…</span>'}<button class="btn rback">Back</button></div></div><div class="confetti"></div>`);
 ov.querySelectorAll('.pcol canvas').forEach((c,i)=>{const p=top[i];if(p)rmSprite(c,p.look)});
 const cf=ov.querySelector('.confetti');for(let i=0;i<60;i++){const d=document.createElement('i');d.style.left=Math.random()*100+'%';d.style.background=pick(['#ffd23f','#e4572e','#3fb8af','#7b5ea7','#f7a1b5']);d.style.animationDelay=Math.random()*1.5+'s';d.style.animationDuration=2+Math.random()*2+'s';cf.appendChild(d)}
 ov.querySelector('.rleave').onclick=rmExit;ov.querySelector('.rback').onclick=rmExit;const ag=ov.querySelector('.again');if(ag)ag.onclick=()=>{const o={mode:'bots',name:RM.name,look:RM.look,dur:RM.dur};const t=RM.tempS;RM.dead=true;RM=null;if(t)S=null;rmStart(o)};
 const ha=ov.querySelector('.hagain');if(ha)ha.onclick=()=>{RM.hstate='lobby';RM.phase='lobby';RM.round++;ROOM.presence({state:'lobby',left:RM.dur*60,round:RM.round}).catch(()=>{});rmLobbyUI()}}

 if(G.mode==='play')update(dt);else if(G.mode==='title'){G.p.x=40*T+Math.sin(G.time*0.08)*900;G.p.y=40*T+Math.cos(G.time*0.06)*800;G.dark=0.15}

 try{await Promise.race([Promise.all([document.fonts.load('20px "Luckiest Guy"'),document.fonts.load('600 16px Fredoka')]),new Promise(r=>setTimeout(r,1800))])}catch(e){}
